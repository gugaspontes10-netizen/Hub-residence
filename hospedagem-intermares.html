<style>
  :root{
    --deep:#0B3B4C;
    --deep-2:#0E5066;
    --sand:#F6EFE3;
    --sand-2:#EBE0CC;
    --ink:#1B2A2E;
    --airbnb:#FF5A5F;
    --booking:#003580;
    --outro:#8A7B5C;
    --warn:#E8493E;
    --line:#DDD2B8;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--sand);color:var(--ink);font-family:'Manrope',sans-serif;}
  body{padding-bottom:100px;}
  header{
    background:linear-gradient(160deg,var(--deep) 0%,var(--deep-2) 100%);
    color:var(--sand);
    padding:28px 20px 22px;
    border-bottom-left-radius:24px;
    border-bottom-right-radius:24px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; right:-30px; top:-30px;
    width:140px; height:140px; border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,0.10),transparent 70%);
  }
  .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.7; font-weight:600;}
  h1{font-family:'Fraunces',serif; font-weight:700; font-size:26px; margin:4px 0 2px; letter-spacing:-0.01em;}
  .sub{font-size:13px; opacity:.75;}
  .stats{display:flex; gap:10px; margin-top:16px;}
  .stat{flex:1; background:rgba(255,255,255,0.08); border-radius:12px; padding:10px 12px;}
  .stat b{display:block; font-size:20px; font-family:'Fraunces',serif;}
  .stat span{font-size:11px; opacity:.75;}

  main{padding:16px 16px 0;}
  .card{background:#fff; border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(11,59,76,0.06);}

  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-nav button{background:var(--sand-2); border:none; width:32px; height:32px; border-radius:9px; font-size:16px; color:var(--deep); cursor:pointer;}
  .cal-title{font-family:'Fraunces',serif; font-weight:600; font-size:16px; text-transform:capitalize;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
  .cal-dow{font-size:10px; color:#9a8f74; font-weight:700; padding-bottom:4px;}
  .cal-day{position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:12px; border-radius:9px; color:var(--ink);}
  .cal-day.empty{visibility:hidden;}
  .cal-day .dot{position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%;}
  .cal-day.occ-airbnb{background:rgba(255,90,95,0.16);}
  .cal-day.occ-booking{background:rgba(0,53,128,0.14);}
  .cal-day.occ-outro{background:rgba(138,123,92,0.18);}
  .cal-day.conflict{background:var(--warn); color:#fff; font-weight:700;}
  .cal-day.today{outline:2px solid var(--deep); outline-offset:-2px;}

  .legend{display:flex; gap:14px; margin-top:10px; flex-wrap:wrap;}
  .legend span{font-size:11px; display:flex; align-items:center; gap:5px; color:#6b6152;}
  .legend i{width:9px; height:9px; border-radius:50%; display:inline-block;}

  .section-title{font-family:'Fraunces',serif; font-size:15px; font-weight:600; margin:0 0 10px; display:flex; align-items:center; justify-content:space-between;}
  .empty-msg{font-size:13px; color:#9a8f74; text-align:center; padding:18px 0;}

  .booking-item{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; position:relative;}
  .booking-item.conflict{border-color:var(--warn); background:rgba(232,73,62,0.05);}
  .b-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .b-tag{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:20px; color:#fff; white-space:nowrap;}
  .tag-airbnb{background:var(--airbnb);}
  .tag-booking{background:var(--booking);}
  .tag-outro{background:var(--outro);}
  .b-guest{font-weight:700; font-size:14px; margin-top:6px;}
  .b-dates{font-size:12px; color:#6b6152; margin-top:2px;}
  .b-valor{font-size:12px; color:#6b6152; margin-top:2px;}
  .b-warn{font-size:11px; color:var(--warn); font-weight:700; margin-top:6px;}
  .b-actions{display:flex; gap:6px; margin-top:10px;}
  .b-actions button{flex:1; border:none; border-radius:9px; padding:8px 0; font-size:12px; font-weight:600; cursor:pointer;}
  .btn-cal{background:var(--deep); color:#fff;}
  .btn-edit{background:var(--sand-2); color:var(--ink);}
  .btn-del{background:transparent; color:var(--warn);}

  .fab{position:fixed; right:20px; bottom:24px; width:56px; height:56px; border-radius:50%; background:var(--deep); color:#fff; font-size:28px; border:none; box-shadow:0 6px 16px rgba(11,59,76,0.35); cursor:pointer; z-index:20;}

  .sheet-backdrop{position:fixed; inset:0; background:rgba(11,20,22,0.45); display:none; align-items:flex-end; z-index:30;}
  .sheet-backdrop.open{display:flex;}
  .sheet{background:#fff; width:100%; border-top-left-radius:22px; border-top-right-radius:22px; padding:18px 18px 26px; max-height:88vh; overflow-y:auto;}
  .sheet h2{font-family:'Fraunces',serif; font-size:18px; margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11px; font-weight:700; color:#6b6152; text-transform:uppercase; letter-spacing:.03em; margin-bottom:5px;}
  .field input, .field select{width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; background:var(--sand);}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .platform-pick{display:flex; gap:8px;}
  .platform-pick button{flex:1; border:2px solid var(--line); background:#fff; border-radius:10px; padding:9px 0; font-size:12px; font-weight:700; cursor:pointer; color:#8b8065;}
  .platform-pick button.active[data-p="airbnb"]{border-color:var(--airbnb); color:var(--airbnb); background:rgba(255,90,95,0.08);}
  .platform-pick button.active[data-p="booking"]{border-color:var(--booking); color:var(--booking); background:rgba(0,53,128,0.06);}
  .platform-pick button.active[data-p="outro"]{border-color:var(--outro); color:var(--outro); background:rgba(138,123,92,0.08);}
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .sheet-actions button{flex:1; border:none; border-radius:12px; padding:13px 0; font-weight:700; font-size:14px; cursor:pointer;}
  .btn-save{background:var(--deep); color:#fff;}
  .btn-cancel{background:var(--sand-2); color:var(--ink);}
  .warn-banner{background:rgba(232,73,62,0.1); color:var(--warn); font-size:12px; font-weight:600; padding:9px 12px; border-radius:10px; margin-bottom:12px; display:none;}
  .warn-banner.show{display:block;}
  .btn-pdf{width:100%; margin-top:12px; background:var(--sand); border:1.5px dashed var(--line); color:var(--deep); font-weight:700; font-size:12px; padding:10px 0; border-radius:12px; cursor:pointer;}
  .toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:var(--deep); color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; z-index:50; opacity:0; transition:opacity .25s; pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<script>
const STORAGE_KEY = 'bookings';
let bookings = [];
let editingId = null;
let selectedPlatform = 'airbnb';
let calMonth = new Date(); calMonth.setDate(1);

const $ = (id) => document.getElementById(id);

async function loadBookings(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    bookings = raw ? JSON.parse(raw) : [];
  }catch(e){ bookings = []; }
  render();
}
async function saveBookings(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
  }catch(e){ console.error('storage error', e); }
}

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function dateRange(startStr, endStr){
  // returns array of yyyy-mm-dd for each night occupied, from checkin (inclusive) to checkout (exclusive)
  const out = [];
  let d = new Date(startStr+'T00:00:00');
  const end = new Date(endStr+'T00:00:00');
  while(d < end){
    out.push(d.toISOString().slice(0,10));
    d.setDate(d.getDate()+1);
  }
  return out;
}

function findConflicts(booking){
  const myDates = new Set(dateRange(booking.checkin, booking.checkout));
  const conflicts = [];
  for(const b of bookings){
    if(b.id === booking.id) continue;
    const theirDates = dateRange(b.checkin, b.checkout);
    if(theirDates.some(d => myDates.has(d))) conflicts.push(b);
  }
  return conflicts;
}

function platformLabel(p){
  return p === 'airbnb' ? 'Airbnb' : p === 'booking' ? 'Booking.com' : 'Outro';
}

function fmtDate(s){
  const [y,m,d] = s.split('-');
  return `${d}/${m}`;
}

function render(){
  renderCalendar();
  renderList();
  renderStats();
}

function renderStats(){
  const now = new Date();
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  let count=0, nights=0, conflictDates = new Set();
  const occByDate = {};
  bookings.forEach(b=>{
    const dates = dateRange(b.checkin, b.checkout);
    let touchesMonth = false;
    dates.forEach(d=>{
      const dt = new Date(d+'T00:00:00');
      if(dt.getFullYear()===y && dt.getMonth()===m){
        touchesMonth = true;
        occByDate[d] = occByDate[d] || [];
        occByDate[d].push(b.id);
      }
    });
    if(touchesMonth) count++;
  });
  Object.keys(occByDate).forEach(d=>{
    nights++;
    if(occByDate[d].length>1) conflictDates.add(d);
  });
  $('stat-mes').textContent = count;
  $('stat-noites').textContent = nights;
  $('stat-conflitos').textContent = conflictDates.size;
}

function renderCalendar(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  $('calTitle').textContent = calMonth.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  const grid = $('calGrid');
  grid.innerHTML = '';
  ['D','S','T','Q','Q','S','S'].forEach(d=>{
    const el = document.createElement('div');
    el.className = 'cal-dow'; el.textContent = d;
    grid.appendChild(el);
  });
  const firstDow = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  for(let i=0;i<firstDow;i++){
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }
  const todayStr = new Date().toISOString().slice(0,10);
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const el = document.createElement('div');
    el.className = 'cal-day';
    el.textContent = day;
    if(dateStr === todayStr) el.classList.add('today');
    const occ = bookings.filter(b => dateRange(b.checkin,b.checkout).includes(dateStr));
    if(occ.length > 1){
      el.classList.add('conflict');
    } else if(occ.length === 1){
      el.classList.add('occ-'+occ[0].platform);
    }
    grid.appendChild(el);
  }
}

function renderList(){
  const list = $('bookingList');
  list.innerHTML = '';
  const sorted = [...bookings].sort((a,b)=> a.checkin.localeCompare(b.checkin));
  if(sorted.length === 0){
    list.innerHTML = '<div class="empty-msg">Nenhuma reserva cadastrada ainda.<br>Toque no + para adicionar.</div>';
    return;
  }
  sorted.forEach(b=>{
    const conflicts = findConflicts(b);
    const item = document.createElement('div');
    item.className = 'booking-item' + (conflicts.length ? ' conflict' : '');
    item.innerHTML = `
      <div class="b-top">
        <div>
          <span class="b-tag tag-${b.platform}">${platformLabel(b.platform)}</span>
          <div class="b-guest">${b.guest || 'Hóspede sem nome'}</div>
          <div class="b-dates">${fmtDate(b.checkin)} → ${fmtDate(b.checkout)}</div>
          ${b.valor ? `<div class="b-valor">R$ ${Number(b.valor).toLocaleString('pt-BR')}</div>` : ''}
          ${b.obs ? `<div class="b-valor">${b.obs}</div>` : ''}
        </div>
      </div>
      ${conflicts.length ? `<div class="b-warn">⚠ Conflito com ${conflicts.map(c=>platformLabel(c.platform)+' ('+c.guest+')').join(', ')}</div>` : ''}
      <div class="b-actions">
        <button class="btn-cal" data-act="cal" data-id="${b.id}">📅 Calendário</button>
        <button class="btn-edit" data-act="edit" data-id="${b.id}">Editar</button>
        <button class="btn-del" data-act="del" data-id="${b.id}">Excluir</button>
      </div>
    `;
    list.appendChild(item);
  });
}

function openSheet(booking){
  editingId = booking ? booking.id : null;
  $('sheetTitle').textContent = booking ? 'Editar reserva' : 'Nova reserva';
  selectedPlatform = booking ? booking.platform : 'airbnb';
  setPlatformUI(selectedPlatform);
  $('fGuest').value = booking ? booking.guest : '';
  $('fCheckin').value = booking ? booking.checkin : '';
  $('fCheckout').value = booking ? booking.checkout : '';
  $('fValor').value = booking ? (booking.valor || '') : '';
  $('fObs').value = booking ? (booking.obs || '') : '';
  $('warnBanner').classList.remove('show');
  $('sheetBackdrop').classList.add('open');
}
function closeSheet(){
  $('sheetBackdrop').classList.remove('open');
}
function setPlatformUI(p){
  selectedPlatform = p;
  document.querySelectorAll('#platformPick button').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.p === p);
  });
}

function generateICS(b){
  const uid = b.id + '@hospedagem-intermares';
  const dtstamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const dstart = b.checkin.replace(/-/g,'');
  const dend = b.checkout.replace(/-/g,'');
  const summary = `${platformLabel(b.platform)} - ${b.guest || 'Hospede'} (Flat 205 Intermares)`;
  const desc = (b.obs || '') + (b.valor ? ` | Valor: R$ ${b.valor}` : '');
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Hospedagem Intermares//PT-BR',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${dtstamp}`,
    `DTSTART;VALUE=DATE:${dstart}`,
    `DTEND;VALUE=DATE:${dend}`,
    `SUMMARY:${summary}`,
    `DESCRIPTION:${desc}`,
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

function generateMonthPDF(){
  if(!window.jspdf){
    toast('Sem conexão para gerar o PDF agora');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const monthLabel = calMonth.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});

  const monthBookings = bookings.filter(b=>{
    return dateRange(b.checkin, b.checkout).some(d=>{
      const dt = new Date(d+'T00:00:00');
      return dt.getFullYear()===y && dt.getMonth()===m;
    });
  }).sort((a,b)=> a.checkin.localeCompare(b.checkin));

  let nights = 0, revenue = 0;
  const conflictSet = new Set();
  const occByDate = {};
  monthBookings.forEach(b=>{
    dateRange(b.checkin,b.checkout).forEach(d=>{
      const dt = new Date(d+'T00:00:00');
      if(dt.getFullYear()===y && dt.getMonth()===m){
        occByDate[d] = occByDate[d] || [];
        occByDate[d].push(b.id);
      }
    });
    if(b.valor) revenue += Number(b.valor);
  });
  Object.keys(occByDate).forEach(d=>{ nights++; if(occByDate[d].length>1) conflictSet.add(d); });

  doc.setFont('helvetica','bold');
  doc.setFontSize(16);
  doc.text('Hospedagem Intermares - Flat 205', 14, 18);
  doc.setFontSize(11);
  doc.setFont('helvetica','normal');
  doc.text(`Relatorio de ${monthLabel}`, 14, 25);

  doc.setFontSize(10);
  doc.text(`Reservas no mes: ${monthBookings.length}`, 14, 35);
  doc.text(`Noites ocupadas: ${nights}`, 14, 41);
  doc.text(`Receita informada: R$ ${revenue.toLocaleString('pt-BR')}`, 14, 47);
  doc.text(`Conflitos de data: ${conflictSet.size}`, 14, 53);

  const rows = monthBookings.map(b=>{
    const conflicts = findConflicts(b);
    return [
      platformLabel(b.platform),
      b.guest || '-',
      fmtDate(b.checkin)+'/'+b.checkin.slice(0,4),
      fmtDate(b.checkout)+'/'+b.checkout.slice(0,4),
      b.valor ? 'R$ '+Number(b.valor).toLocaleString('pt-BR') : '-',
      conflicts.length ? 'SIM' : ''
    ];
  });

  if(typeof doc.autoTable === 'function'){
    doc.autoTable({
      startY: 60,
      head: [['Plataforma','Hospede','Check-in','Check-out','Valor','Conflito']],
      body: rows.length ? rows : [['-','Nenhuma reserva neste mes','-','-','-','-']],
      styles:{fontSize:9},
      headStyles:{fillColor:[11,59,76]}
    });
  } else {
    let yPos = 62;
    doc.setFontSize(9);
    doc.text('Plataforma / Hospede / Check-in / Check-out / Valor', 14, yPos);
    yPos += 6;
    (rows.length ? rows : [['-','Nenhuma reserva neste mes','-','-','-','-']]).forEach(r=>{
      doc.text(r.slice(0,5).join('  |  '), 14, yPos);
      yPos += 6;
    });
  }

  doc.save(`relatorio-intermares-${String(m+1).padStart(2,'0')}-${y}.pdf`);
}

// events
$('pdfBtn').addEventListener('click', generateMonthPDF);
$('addBtn').addEventListener('click', ()=> openSheet(null));
$('cancelBtn').addEventListener('click', closeSheet);
$('sheetBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='sheetBackdrop') closeSheet(); });
document.querySelectorAll('#platformPick button').forEach(btn=>{
  btn.addEventListener('click', ()=> setPlatformUI(btn.dataset.p));
});
$('prevMonth').addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()-1); render(); });
$('nextMonth').addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()+1); render(); });

$('saveBtn').addEventListener('click', async ()=>{
  const guest = $('fGuest').value.trim();
  const checkin = $('fCheckin').value;
  const checkout = $('fCheckout').value;
  const valor = $('fValor').value;
  const obs = $('fObs').value.trim();

  if(!checkin || !checkout){ toast('Preencha check-in e check-out'); return; }
  if(checkout <= checkin){ toast('Check-out deve ser depois do check-in'); return; }

  const booking = {
    id: editingId || ('b_' + Date.now()),
    platform: selectedPlatform,
    guest, checkin, checkout,
    valor: valor ? Number(valor) : null,
    obs
  };

  const conflicts = findConflicts(booking);
  if(conflicts.length){
    $('warnBanner').textContent = '⚠ Conflito de datas com: ' + conflicts.map(c=>platformLabel(c.platform)+' - '+(c.guest||'')).join(', ');
    $('warnBanner').classList.add('show');
  }

  if(editingId){
    bookings = bookings.map(b => b.id === editingId ? booking : b);
  } else {
    bookings.push(booking);
  }
  await saveBookings();
  closeSheet();
  render();
  toast(conflicts.length ? 'Salvo com conflito de datas!' : 'Reserva salva');
});

$('bookingList').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const id = btn.dataset.id;
  const booking = bookings.find(b=>b.id===id);
  if(!booking) return;
  const act = btn.dataset.act;
  if(act === 'edit'){
    openSheet(booking);
  } else if(act === 'del'){
    if(confirm(`Excluir reserva de ${booking.guest||'hóspede'}?`)){
      bookings = bookings.filter(b=>b.id!==id);
      await saveBookings();
      render();
      toast('Reserva excluída');
    }
  } else if(act === 'cal'){
    generateICS(booking);
    toast('Abrindo arquivo do evento...');
  }
});

loadBookings();
</script>
