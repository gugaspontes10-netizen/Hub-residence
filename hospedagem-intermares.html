<style>
  :root{
    --deep:#0B3B4C;
    --deep-2:#0E5066;
    --sand:#F6EFE3;
    --sand-2:#EBE0CC;
    --ink:#1B2A2E;
    --airbnb:#FF5A5F;
    --booking:#003580;
    --outro:#8A7B5C;
    --warn:#E8493E;
    --line:#DDD2B8;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--sand);color:var(--ink);font-family:'Manrope',sans-serif;}
  body{padding-bottom:100px;}
  header{
    background:linear-gradient(160deg,var(--deep) 0%,var(--deep-2) 100%);
    color:var(--sand);
    padding:28px 20px 22px;
    border-bottom-left-radius:24px;
    border-bottom-right-radius:24px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; right:-30px; top:-30px;
    width:140px; height:140px; border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,0.10),transparent 70%);
  }
  .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.7; font-weight:600;}
  h1{font-family:'Fraunces',serif; font-weight:700; font-size:26px; margin:4px 0 2px; letter-spacing:-0.01em;}
  .sub{font-size:13px; opacity:.75;}
  .stats{display:flex; gap:10px; margin-top:16px;}
  .stat{flex:1; background:rgba(255,255,255,0.08); border-radius:12px; padding:10px 12px;}
  .stat b{display:block; font-size:20px; font-family:'Fraunces',serif;}
  .stat span{font-size:11px; opacity:.75;}

  main{padding:16px 16px 0;}
  .card{background:#fff; border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(11,59,76,0.06);}

  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-nav button{background:var(--sand-2); border:none; width:32px; height:32px; border-radius:9px; font-size:16px; color:var(--deep); cursor:pointer;}
  .cal-title{font-family:'Fraunces',serif; font-weight:600; font-size:16px; text-transform:capitalize;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
  .cal-dow{font-size:10px; color:#9a8f74; font-weight:700; padding-bottom:4px;}
  .cal-day{position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:12px; border-radius:9px; color:var(--ink);}
  .cal-day.empty{visibility:hidden;}
  .cal-day .dot{position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%;}
  .cal-day.occ-airbnb{background:rgba(255,90,95,0.16);}
  .cal-day.occ-booking{background:rgba(0,53,128,0.14);}
  .cal-day.occ-outro{background:rgba(138,123,92,0.18);}
  .cal-day.conflict{background:var(--warn); color:#fff; font-weight:700;}
  .cal-day.today{outline:2px solid var(--deep); outline-offset:-2px;}

  .legend{display:flex; gap:14px; margin-top:10px; flex-wrap:wrap;}
  .legend span{font-size:11px; display:flex; align-items:center; gap:5px; color:#6b6152;}
  .legend i{width:9px; height:9px; border-radius:50%; display:inline-block;}

  .section-title{font-family:'Fraunces',serif; font-size:15px; font-weight:600; margin:0 0 10px; display:flex; align-items:center; justify-content:space-between;}
  .empty-msg{font-size:13px; color:#9a8f74; text-align:center; padding:18px 0;}

  .booking-item{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; position:relative;}
  .booking-item.conflict{border-color:var(--warn); background:rgba(232,73,62,0.05);}
  .b-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .b-tag{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:20px; color:#fff; white-space:nowrap;}
  .tag-airbnb{background:var(--airbnb);}
  .tag-booking{background:var(--booking);}
  .tag-outro{background:var(--outro);}
  .b-guest{font-weight:700; font-size:14px; margin-top:6px;}
  .b-dates{font-size:12px; color:#6b6152; margin-top:2px;}
  .b-valor{font-size:12px; color:#6b6152; margin-top:2px;}
  .b-warn{font-size:11px; color:var(--warn); font-weight:700; margin-top:6px;}
  .b-actions{display:flex; gap:6px; margin-top:10px;}
  .b-actions button{flex:1; border:none; border-radius:9px; padding:8px 0; font-size:12px; font-weight:600; cursor:pointer;}
  .btn-cal{background:var(--deep); color:#fff;}
  .btn-edit{background:var(--sand-2); color:var(--ink);}
  .btn-del{background:transparent; color:var(--warn);}

  .fab{position:fixed; right:20px; bottom:24px; width:56px; height:56px; border-radius:50%; background:var(--deep); color:#fff; font-size:28px; border:none; box-shadow:0 6px 16px rgba(11,59,76,0.35); cursor:pointer; z-index:20;}

  .sheet-backdrop{position:fixed; inset:0; background:rgba(11,20,22,0.45); display:none; align-items:flex-end; z-index:30;}
  .sheet-backdrop.open{display:flex;}
  .sheet{background:#fff; width:100%; border-top-left-radius:22px; border-top-right-radius:22px; padding:18px 18px 26px; max-height:88vh; overflow-y:auto;}
  .sheet h2{font-family:'Fraunces',serif; font-size:18px; margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11px; font-weight:700; color:#6b6152; text-transform:uppercase; letter-spacing:.03em; margin-bottom:5px;}
  .field-hint{font-size:10px; color:var(--booking); margin-top:4px; font-weight:600;}
  .field input, .field select{width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; background:var(--sand);}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .platform-pick{display:flex; gap:8px;}
  .platform-pick button{flex:1; border:2px solid var(--line); background:#fff; border-radius:10px; padding:9px 0; font-size:12px; font-weight:700; cursor:pointer; color:#8b8065;}
  .platform-pick button.active[data-p="airbnb"]{border-color:var(--airbnb); color:var(--airbnb); background:rgba(255,90,95,0.08);}
  .platform-pick button.active[data-p="booking"]{border-color:var(--booking); color:var(--booking); background:rgba(0,53,128,0.06);}
  .platform-pick button.active[data-p="outro"]{border-color:var(--outro); color:var(--outro); background:rgba(138,123,92,0.08);}
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .sheet-actions button{flex:1; border:none; border-radius:12px; padding:13px 0; font-weight:700; font-size:14px; cursor:pointer;}
  .btn-save{background:var(--deep); color:#fff;}
  .btn-cancel{background:var(--sand-2); color:var(--ink);}
  .warn-banner{background:rgba(232,73,62,0.1); color:var(--warn); font-size:12px; font-weight:600; padding:9px 12px; border-radius:10px; margin-bottom:12px; display:none;}
  .warn-banner.show{display:block;}
  .btn-pdf{width:100%; margin-top:12px; background:var(--sand); border:1.5px dashed var(--line); color:var(--deep); font-weight:700; font-size:12px; padding:10px 0; border-radius:12px; cursor:pointer;}
  .btn-copy-prev{background:none; border:none; color:var(--deep-2); font-size:11px; font-weight:700; text-decoration:underline; cursor:pointer;}
  .btn-add-cost{width:100%; margin-top:10px; background:var(--sand); border:1.5px dashed var(--line); color:var(--deep); font-weight:700; font-size:12px; padding:10px 0; border-radius:12px; cursor:pointer;}
  .cost-item{display:flex; justify-content:space-between; align-items:center; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
  .cost-info{display:flex; flex-direction:column; gap:2px;}
  .cost-tag{font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:2px 8px; border-radius:20px; color:#fff; width:fit-content;}
  .cost-desc{font-size:13px; font-weight:600; margin-top:3px;}
  .cost-actions{display:flex; align-items:center; gap:10px;}
  .cost-valor{font-size:13px; font-weight:700; color:var(--ink);}
  .cost-del{background:none; border:none; color:var(--warn); font-size:16px; cursor:pointer;}
  .compare-row{display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px solid var(--line);}
  .compare-row:last-child{border-bottom:none;}
  .compare-plat{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700;}
  .compare-dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .compare-nums{text-align:right; font-size:11px; color:#6b6152; line-height:1.5;}
  .compare-nums b{color:var(--ink); font-size:13px;}
  .toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:var(--deep); color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; z-index:50; opacity:0; transition:opacity .25s; pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Hub Residence · Flat 205</div>
  <h1>Hospedagem Intermares</h1>
  <div class="sub">Controle de reservas Airbnb + Booking.com</div>
  <div class="stats">
    <div class="stat"><b id="stat-ocupacao">0%</b><span>ocupação do mês</span></div>
    <div class="stat"><b id="stat-receita">R$0</b><span>receita do mês</span></div>
    <div class="stat"><b id="stat-lucro">R$0</b><span>lucro líquido</span></div>
  </div>
</header>

<main>
  <div class="card">
    <div class="cal-nav">
      <button id="prevMonth">‹</button>
      <div class="cal-title" id="calTitle"></div>
      <button id="nextMonth">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend">
      <span><i style="background:var(--airbnb)"></i>Airbnb</span>
      <span><i style="background:var(--booking)"></i>Booking.com</span>
      <span><i style="background:var(--outro)"></i>Outro</span>
      <span><i style="background:var(--warn)"></i>Conflito</span>
    </div>
    <button class="btn-pdf" id="pdfBtn">📄 Baixar relatório PDF do mês</button>
    <button class="btn-pdf" id="pdfYearBtn">📊 Baixar relatório PDF anual</button>
  </div>

  <div class="card">
    <div class="section-title">
      Custos do mês
      <button class="btn-copy-prev" id="copyPrevBtn">Copiar mês anterior</button>
    </div>
    <div id="costsList"></div>
    <button class="btn-add-cost" id="addCostBtn">+ Adicionar custo</button>
  </div>

  <div class="card">
    <div class="section-title">Por plataforma</div>
    <div id="platformCompare"></div>
  </div>

  <div class="card">
    <div class="section-title">Reservas</div>
    <div id="bookingList"></div>
  </div>
</main>

<button class="fab" id="addBtn">+</button>

<div class="sheet-backdrop" id="costSheetBackdrop">
  <div class="sheet">
    <h2 id="costSheetTitle">Novo custo</h2>
    <div class="field">
      <label>Categoria</label>
      <select id="cCategoria">
        <option value="financiamento">Financiamento</option>
        <option value="condominio">Condomínio</option>
        <option value="energia">Energia</option>
        <option value="iptu">IPTU</option>
        <option value="manutencao">Manutenção/Reparo</option>
        <option value="outro">Outro</option>
      </select>
    </div>
    <div class="field">
      <label>Descrição</label>
      <input type="text" id="cDescricao" placeholder="ex: parcela financiamento">
    </div>
    <div class="field">
      <label>Valor (R$)</label>
      <input type="number" id="cValor" placeholder="0">
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="costCancelBtn">Cancelar</button>
      <button class="btn-save" id="costSaveBtn">Salvar</button>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <h2 id="sheetTitle">Nova reserva</h2>
    <div class="warn-banner" id="warnBanner"></div>
    <div class="field">
      <label>Plataforma</label>
      <div class="platform-pick" id="platformPick">
        <button type="button" data-p="airbnb">Airbnb</button>
        <button type="button" data-p="booking">Booking</button>
        <button type="button" data-p="outro">Outro</button>
      </div>
    </div>
    <div class="field">
      <label>Hóspede</label>
      <input type="text" id="fGuest" placeholder="Nome do hóspede">
    </div>
    <div class="row2">
      <div class="field">
        <label>Check-in</label>
        <input type="date" id="fCheckin">
      </div>
      <div class="field">
        <label>Check-out</label>
        <input type="date" id="fCheckout">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Valor (R$)</label>
        <input type="number" id="fValor" placeholder="opcional">
        <div class="field-hint" id="valorHint"></div>
      </div>
      <div class="field">
        <label>Obs.</label>
        <input type="text" id="fObs" placeholder="opcional">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="cancelBtn">Cancelar</button>
      <button class="btn-save" id="saveBtn">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<script>
const STORAGE_KEY = 'bookings';
const COSTS_KEY = 'costs';
let bookings = [];
let costs = [];
let editingId = null;
let editingCostId = null;
let selectedPlatform = 'airbnb';
let calMonth = new Date(); calMonth.setDate(1);

const $ = (id) => document.getElementById(id);

function monthKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

async function loadCosts(){
  try{
    const raw = localStorage.getItem(COSTS_KEY);
    costs = raw ? JSON.parse(raw) : [];
  }catch(e){ costs = []; }
}
async function saveCosts(){
  try{
    localStorage.setItem(COSTS_KEY, JSON.stringify(costs));
  }catch(e){ console.error('storage error', e); }
}

const CATEGORY_LABELS = {
  financiamento: 'Financiamento',
  condominio: 'Condomínio',
  energia: 'Energia',
  iptu: 'IPTU',
  manutencao: 'Manutenção',
  outro: 'Outro'
};
const CATEGORY_COLORS = {
  financiamento: '#0B3B4C',
  condominio: '#0E5066',
  energia: '#FF5A5F',
  iptu: '#8A7B5C',
  manutencao: '#E8493E',
  outro: '#9a8f74'
};

const BOOKING_COMMISSION = 0.15; // 15% fixo - comissão do Booking.com
function valorLiquido(b){
  if(!b.valor) return 0;
  if(b.platform === 'booking') return Number(b.valor) * (1 - BOOKING_COMMISSION);
  return Number(b.valor);
}

async function loadBookings(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    bookings = raw ? JSON.parse(raw) : [];
  }catch(e){ bookings = []; }
  render();
}
async function saveBookings(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
  }catch(e){ console.error('storage error', e); }
}

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function dateRange(startStr, endStr){
  // returns array of yyyy-mm-dd for each night occupied, from checkin (inclusive) to checkout (exclusive)
  const out = [];
  let d = new Date(startStr+'T00:00:00');
  const end = new Date(endStr+'T00:00:00');
  while(d < end){
    out.push(d.toISOString().slice(0,10));
    d.setDate(d.getDate()+1);
  }
  return out;
}

function findConflicts(booking){
  const myDates = new Set(dateRange(booking.checkin, booking.checkout));
  const conflicts = [];
  for(const b of bookings){
    if(b.id === booking.id) continue;
    const theirDates = dateRange(b.checkin, b.checkout);
    if(theirDates.some(d => myDates.has(d))) conflicts.push(b);
  }
  return conflicts;
}

function platformLabel(p){
  return p === 'airbnb' ? 'Airbnb' : p === 'booking' ? 'Booking.com' : 'Outro';
}

function fmtDate(s){
  const [y,m,d] = s.split('-');
  return `${d}/${m}`;
}

function render(){
  renderCalendar();
  renderList();
  renderCosts();
  renderPlatformCompare();
  renderStats();
}

function nightsInMonth(b, y, m){
  return dateRange(b.checkin, b.checkout).filter(d=>{
    const dt = new Date(d+'T00:00:00');
    return dt.getFullYear()===y && dt.getMonth()===m;
  }).length;
}
function totalNights(b){
  return dateRange(b.checkin, b.checkout).length;
}
function monthRevenueShare(b, y, m){
  const total = totalNights(b);
  if(total === 0) return 0;
  const share = nightsInMonth(b, y, m) / total;
  return valorLiquido(b) * share;
}

function monthRevenue(y, m){
  let total = 0;
  bookings.forEach(b=>{
    total += monthRevenueShare(b, y, m);
  });
  return total;
}
function monthCosts(y, m){
  const key = `${y}-${String(m+1).padStart(2,'0')}`;
  return costs.filter(c=>c.month===key).reduce((s,c)=>s+Number(c.valor||0), 0);
}

function renderStats(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const daysInMonth = new Date(y,m+1,0).getDate();
  let nights = 0;
  const occByDate = {};
  bookings.forEach(b=>{
    dateRange(b.checkin,b.checkout).forEach(d=>{
      const dt = new Date(d+'T00:00:00');
      if(dt.getFullYear()===y && dt.getMonth()===m){
        occByDate[d] = true;
      }
    });
  });
  nights = Object.keys(occByDate).length;
  const ocupacao = daysInMonth ? Math.round((nights/daysInMonth)*100) : 0;
  const receita = monthRevenue(y, m);
  const custosMes = monthCosts(y, m);
  const lucro = receita - custosMes;

  $('stat-ocupacao').textContent = ocupacao + '%';
  $('stat-receita').textContent = 'R$' + receita.toLocaleString('pt-BR');
  $('stat-lucro').textContent = 'R$' + lucro.toLocaleString('pt-BR');
}

function renderCosts(){
  const key = monthKey(calMonth);
  const list = $('costsList');
  const monthCostsArr = costs.filter(c=>c.month===key).sort((a,b)=> Number(b.valor)-Number(a.valor));
  if(monthCostsArr.length===0){
    list.innerHTML = '<div class="empty-msg">Nenhum custo lançado neste mês.</div>';
    return;
  }
  list.innerHTML = monthCostsArr.map(c=>`
    <div class="cost-item">
      <div class="cost-info">
        <span class="cost-tag" style="background:${CATEGORY_COLORS[c.categoria]||'#9a8f74'}">${CATEGORY_LABELS[c.categoria]||'Outro'}</span>
        <span class="cost-desc">${c.descricao||''}</span>
      </div>
      <div class="cost-actions">
        <span class="cost-valor">R$ ${Number(c.valor).toLocaleString('pt-BR')}</span>
        <button class="cost-del" data-act="editCost" data-id="${c.id}">✎</button>
        <button class="cost-del" data-act="delCost" data-id="${c.id}">✕</button>
      </div>
    </div>
  `).join('');
}

function renderPlatformCompare(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const platforms = ['airbnb','booking','outro'];
  const el = $('platformCompare');
  el.innerHTML = platforms.map(p=>{
    const plBookings = bookings.filter(b=>b.platform===p);
    let nights = 0, receita = 0, reservasNoMes = 0;
    const nightSet = new Set();
    plBookings.forEach(b=>{
      let touches = false;
      dateRange(b.checkin,b.checkout).forEach(d=>{
        const dt = new Date(d+'T00:00:00');
        if(dt.getFullYear()===y && dt.getMonth()===m){
          nightSet.add(d);
          touches = true;
        }
      });
      if(touches){
        reservasNoMes++;
        receita += monthRevenueShare(b, y, m);
      }
    });
    nights = nightSet.size;
    const ocupacao = daysInMonth ? Math.round((nights/daysInMonth)*100) : 0;
    const adr = nights ? (receita/nights) : 0;
    const color = p==='airbnb' ? 'var(--airbnb)' : p==='booking' ? 'var(--booking)' : 'var(--outro)';
    return `
      <div class="compare-row">
        <div class="compare-plat"><span class="compare-dot" style="background:${color}"></span>${platformLabel(p)}</div>
        <div class="compare-nums">
          <div>${reservasNoMes} reserva(s) · ${ocupacao}% ocupação</div>
          <div>Receita: <b>R$ ${receita.toLocaleString('pt-BR')}</b> · Diária média: R$ ${adr.toLocaleString('pt-BR',{maximumFractionDigits:0})}</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderCalendar(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  $('calTitle').textContent = calMonth.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  const grid = $('calGrid');
  grid.innerHTML = '';
  ['D','S','T','Q','Q','S','S'].forEach(d=>{
    const el = document.createElement('div');
    el.className = 'cal-dow'; el.textContent = d;
    grid.appendChild(el);
  });
  const firstDow = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  for(let i=0;i<firstDow;i++){
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }
  const todayStr = new Date().toISOString().slice(0,10);
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const el = document.createElement('div');
    el.className = 'cal-day';
    el.textContent = day;
    if(dateStr === todayStr) el.classList.add('today');
    const occ = bookings.filter(b => dateRange(b.checkin,b.checkout).includes(dateStr));
    if(occ.length > 1){
      el.classList.add('conflict');
    } else if(occ.length === 1){
      el.classList.add('occ-'+occ[0].platform);
    }
    grid.appendChild(el);
  }
}

function renderList(){
  const list = $('bookingList');
  list.innerHTML = '';
  const sorted = [...bookings].sort((a,b)=> a.checkin.localeCompare(b.checkin));
  if(sorted.length === 0){
    list.innerHTML = '<div class="empty-msg">Nenhuma reserva cadastrada ainda.<br>Toque no + para adicionar.</div>';
    return;
  }
  sorted.forEach(b=>{
    const conflicts = findConflicts(b);
    const item = document.createElement('div');
    item.className = 'booking-item' + (conflicts.length ? ' conflict' : '');
    item.innerHTML = `
      <div class="b-top">
        <div>
          <span class="b-tag tag-${b.platform}">${platformLabel(b.platform)}</span>
          <div class="b-guest">${b.guest || 'Hóspede sem nome'}</div>
          <div class="b-dates">${fmtDate(b.checkin)} → ${fmtDate(b.checkout)}</div>
          ${b.valor ? `<div class="b-valor">R$ ${Number(b.valor).toLocaleString('pt-BR')}${b.platform==='booking' ? ' bruto · líquido R$ '+valorLiquido(b).toLocaleString('pt-BR',{maximumFractionDigits:0}) : ''}</div>` : ''}
          ${b.obs ? `<div class="b-valor">${b.obs}</div>` : ''}
        </div>
      </div>
      ${conflicts.length ? `<div class="b-warn">⚠ Conflito com ${conflicts.map(c=>platformLabel(c.platform)+' ('+c.guest+')').join(', ')}</div>` : ''}
      <div class="b-actions">
        <button class="btn-cal" data-act="cal" data-id="${b.id}">📅 Calendário</button>
        <button class="btn-edit" data-act="edit" data-id="${b.id}">Editar</button>
        <button class="btn-del" data-act="del" data-id="${b.id}">Excluir</button>
      </div>
    `;
    list.appendChild(item);
  });
}

function openSheet(booking){
  editingId = booking ? booking.id : null;
  $('sheetTitle').textContent = booking ? 'Editar reserva' : 'Nova reserva';
  selectedPlatform = booking ? booking.platform : 'airbnb';
  setPlatformUI(selectedPlatform);
  $('fGuest').value = booking ? booking.guest : '';
  $('fCheckin').value = booking ? booking.checkin : '';
  $('fCheckout').value = booking ? booking.checkout : '';
  $('fValor').value = booking ? (booking.valor || '') : '';
  $('fObs').value = booking ? (booking.obs || '') : '';
  $('warnBanner').classList.remove('show');
  $('sheetBackdrop').classList.add('open');
}
function closeSheet(){
  $('sheetBackdrop').classList.remove('open');
}
function setPlatformUI(p){
  selectedPlatform = p;
  document.querySelectorAll('#platformPick button').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.p === p);
  });
  const hint = $('valorHint');
  if(p === 'booking'){
    hint.textContent = `Desconta ${Math.round(BOOKING_COMMISSION*100)}% de comissão automaticamente`;
  } else {
    hint.textContent = '';
  }
}

function openCostSheet(cost){
  editingCostId = cost ? cost.id : null;
  $('costSheetTitle').textContent = cost ? 'Editar custo' : 'Novo custo';
  $('cCategoria').value = cost ? cost.categoria : 'financiamento';
  $('cDescricao').value = cost ? cost.descricao : '';
  $('cValor').value = cost ? cost.valor : '';
  $('costSheetBackdrop').classList.add('open');
}
function closeCostSheet(){
  $('costSheetBackdrop').classList.remove('open');
}

function copyPrevMonthCosts(){
  const prev = new Date(calMonth);
  prev.setMonth(prev.getMonth()-1);
  const prevKey = monthKey(prev);
  const curKey = monthKey(calMonth);
  const prevCosts = costs.filter(c=>c.month===prevKey);
  if(prevCosts.length===0){
    toast('Sem custos no mês anterior');
    return;
  }
  prevCosts.forEach(c=>{
    costs.push({
      id: 'c_' + Date.now() + Math.random().toString(36).slice(2,6),
      month: curKey,
      categoria: c.categoria,
      descricao: c.descricao,
      valor: c.valor
    });
  });
  saveCosts();
  render();
  toast('Custos copiados do mês anterior');
}

function generateICS(b){
  const uid = b.id + '@hospedagem-intermares';
  const dtstamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const dstart = b.checkin.replace(/-/g,'');
  const dend = b.checkout.replace(/-/g,'');
  const summary = `${platformLabel(b.platform)} - ${b.guest || 'Hospede'} (Flat 205 Intermares)`;
  const desc = (b.obs || '') + (b.valor ? ` | Valor: R$ ${b.valor}` : '');
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Hospedagem Intermares//PT-BR',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${dtstamp}`,
    `DTSTART;VALUE=DATE:${dstart}`,
    `DTEND;VALUE=DATE:${dend}`,
    `SUMMARY:${summary}`,
    `DESCRIPTION:${desc}`,
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  const filename = `reserva-${(b.guest||'hospede').replace(/[^a-zA-Z0-9]+/g,'-')}-${b.checkin}.ics`;
  const dataUri = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  const a = document.createElement('a');
  a.href = dataUri;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function drawPieChart(doc, cx, cy, r, data){
  const total = data.reduce((s,d)=>s+d.value,0);
  if(total <= 0) return false;
  let startAngle = -90;
  data.forEach(d=>{
    if(d.value <= 0) return;
    const sliceAngle = (d.value/total)*360;
    const steps = Math.max(2, Math.ceil(sliceAngle/3));
    const stepAngle = sliceAngle/steps;
    const points = [];
    for(let i=0;i<=steps;i++){
      const a = (startAngle + i*stepAngle) * Math.PI/180;
      points.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]);
    }
    // caminho unico: centro -> ponto a ponto pelo arco -> volta ao centro
    const lineArr = [];
    let curX = cx, curY = cy;
    lineArr.push([points[0][0]-curX, points[0][1]-curY]); curX=points[0][0]; curY=points[0][1];
    for(let i=1;i<points.length;i++){
      lineArr.push([points[i][0]-curX, points[i][1]-curY]);
      curX=points[i][0]; curY=points[i][1];
    }
    lineArr.push([cx-curX, cy-curY]);
    doc.setFillColor(d.color[0], d.color[1], d.color[2]);
    doc.setDrawColor(d.color[0], d.color[1], d.color[2]);
    doc.setLineWidth(0.1);
    doc.lines(lineArr, cx, cy, [1,1], 'FD', true);
    startAngle += sliceAngle;
  });
  return true;
}

function drawPieLegend(doc, x, y, data){
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  let yPos = y;
  data.forEach(d=>{
    if(d.value <= 0) return;
    doc.setFillColor(d.color[0], d.color[1], d.color[2]);
    doc.rect(x, yPos-3.5, 5, 5, 'F');
    doc.setFontSize(8);
    doc.setTextColor(30,30,30);
    const pct = Math.round((d.value/total)*100);
    doc.text(`${d.label}: R$ ${d.value.toLocaleString('pt-BR')} (${pct}%)`, x+8, yPos);
    yPos += 7;
  });
  doc.setTextColor(0,0,0);
  return yPos;
}

const PLATFORM_COLORS_RGB = { airbnb:[255,90,95], booking:[0,53,128], outro:[138,123,92] };
const CATEGORY_COLORS_RGB = {
  financiamento:[11,59,76], condominio:[14,80,102], energia:[255,90,95],
  iptu:[138,123,92], manutencao:[232,73,62], outro:[154,143,116]
};

function pdfHeader(doc, subtitle){
  doc.setFillColor(11,59,76);
  doc.rect(0, 0, 210, 32, 'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(17);
  doc.text('HOSPEDAGEM INTERMARES', 14, 14);
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.text('Hub Residence · Flat 205 · Intermares, Cabedelo', 14, 20);
  doc.setFontSize(11);
  doc.setFont('helvetica','bold');
  doc.text(subtitle, 14, 27);
  doc.setTextColor(0,0,0);
  doc.setFont('helvetica','normal');
  return 42;
}

function pdfSectionTitle(doc, cursorY, title){
  doc.setFont('helvetica','bold');
  doc.setFontSize(10.5);
  doc.setTextColor(11,59,76);
  doc.text(title.toUpperCase(), 14, cursorY);
  doc.setDrawColor(221,210,184);
  doc.setLineWidth(0.4);
  doc.line(14, cursorY+2.2, 196, cursorY+2.2);
  doc.setTextColor(0,0,0);
  doc.setFont('helvetica','normal');
  return cursorY + 9;
}

function drawKPICards(doc, cursorY, cards){
  const margin = 14, gap = 4, totalW = 182;
  const boxW = (totalW - gap*(cards.length-1))/cards.length;
  const boxH = 22;
  cards.forEach((c,i)=>{
    const x = margin + i*(boxW+gap);
    doc.setFillColor(246,239,227);
    doc.roundedRect(x, cursorY, boxW, boxH, 1.5, 1.5, 'F');
    doc.setFontSize(7.5);
    doc.setTextColor(120,110,90);
    doc.setFont('helvetica','bold');
    doc.text(c.label.toUpperCase(), x+4, cursorY+8, {maxWidth: boxW-8});
    doc.setFontSize(12.5);
    doc.setTextColor(c.color ? c.color[0] : 11, c.color ? c.color[1] : 59, c.color ? c.color[2] : 76);
    doc.text(c.value, x+4, cursorY+17, {maxWidth: boxW-8});
  });
  doc.setTextColor(0,0,0);
  doc.setFont('helvetica','normal');
  return cursorY + boxH + 10;
}

function drawPieSection(doc, cursorY, title, data){
  cursorY = pdfSectionTitle(doc, cursorY, title);
  const total = data.reduce((s,d)=>s+d.value,0);
  if(total <= 0){
    doc.setFontSize(9);
    doc.setTextColor(120,110,90);
    doc.text('Sem dados neste período.', 14, cursorY+2);
    doc.setTextColor(0,0,0);
    return cursorY + 14;
  }
  const r = 24;
  const cx = 40, cy = cursorY + r + 2;
  drawPieChart(doc, cx, cy, r, data);
  const legendBottom = drawPieLegend(doc, 82, cursorY+8, data);
  return Math.max(cy + r, legendBottom) + 10;
}

function generateMonthPDF(){
  if(!window.jspdf){
    toast('Sem conexão para gerar o PDF agora');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const monthLabel = calMonth.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});

  const monthBookings = bookings.filter(b => nightsInMonth(b, y, m) > 0)
    .sort((a,b)=> a.checkin.localeCompare(b.checkin));

  let nights = 0, revenue = 0;
  const conflictSet = new Set();
  const occByDate = {};
  monthBookings.forEach(b=>{
    dateRange(b.checkin,b.checkout).forEach(d=>{
      const dt = new Date(d+'T00:00:00');
      if(dt.getFullYear()===y && dt.getMonth()===m){
        occByDate[d] = occByDate[d] || [];
        occByDate[d].push(b.id);
      }
    });
    revenue += monthRevenueShare(b, y, m);
  });
  Object.keys(occByDate).forEach(d=>{ nights++; if(occByDate[d].length>1) conflictSet.add(d); });

  const custosMes = monthCosts(y, m);
  const lucroMes = revenue - custosMes;
  const margem = revenue ? Math.round((lucroMes/revenue)*100) : 0;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const ocupacao = daysInMonth ? Math.round((nights/daysInMonth)*100) : 0;

  let cursorY = pdfHeader(doc, `Relatório mensal · ${monthLabel.charAt(0).toUpperCase()+monthLabel.slice(1)}`);

  cursorY = drawKPICards(doc, cursorY, [
    {label:'Ocupação', value: ocupacao+'%'},
    {label:'Receita líquida', value: 'R$ '+revenue.toLocaleString('pt-BR',{maximumFractionDigits:0})},
    {label:'Custos', value: 'R$ '+custosMes.toLocaleString('pt-BR',{maximumFractionDigits:0})},
    {label:'Lucro líquido', value: 'R$ '+lucroMes.toLocaleString('pt-BR',{maximumFractionDigits:0}), color:[14,110,80]}
  ]);

  doc.setFontSize(8.5);
  doc.setTextColor(120,110,90);
  doc.text(`${monthBookings.length} reserva(s) · ${nights} noite(s) ocupada(s) · margem de lucro ${margem}% · ${conflictSet.size} conflito(s) de data`, 14, cursorY);
  doc.setTextColor(0,0,0);
  cursorY += 8;

  cursorY = pdfSectionTitle(doc, cursorY, 'Reservas do mês');

  const rows = monthBookings.map(b=>{
    const conflicts = findConflicts(b);
    const valorTxt = b.valor
      ? (b.platform==='booking'
          ? `R$ ${Number(b.valor).toLocaleString('pt-BR')} (líq. R$ ${valorLiquido(b).toLocaleString('pt-BR',{maximumFractionDigits:0})})`
          : `R$ ${Number(b.valor).toLocaleString('pt-BR')}`)
      : '-';
    return [
      platformLabel(b.platform),
      b.guest || '-',
      fmtDate(b.checkin)+'/'+b.checkin.slice(0,4),
      fmtDate(b.checkout)+'/'+b.checkout.slice(0,4),
      valorTxt,
      conflicts.length ? 'Sim' : ''
    ];
  });

  if(typeof doc.autoTable === 'function'){
    doc.autoTable({
      startY: cursorY,
      margin: {left:14, right:14},
      head: [['Plataforma','Hóspede','Check-in','Check-out','Valor','Conflito']],
      body: rows.length ? rows : [['-','Nenhuma reserva neste mês','-','-','-','-']],
      styles:{fontSize:8.5, cellPadding:2.5},
      headStyles:{fillColor:[11,59,76], fontSize:8},
      alternateRowStyles:{fillColor:[248,245,238]}
    });
    cursorY = doc.lastAutoTable.finalY + 12;
  } else {
    cursorY += 6;
    doc.setFontSize(9);
    (rows.length ? rows : [['-','Nenhuma reserva neste mes','-','-','-','-']]).forEach(r=>{
      doc.text(r.slice(0,5).join('  |  '), 14, cursorY);
      cursorY += 6;
    });
    cursorY += 6;
  }

  const custoRows = costs.filter(c=>c.month===monthKey(calMonth)).map(c=>[
    CATEGORY_LABELS[c.categoria]||'Outro',
    c.descricao||'-',
    'R$ '+Number(c.valor).toLocaleString('pt-BR')
  ]);
  if(custoRows.length){
    cursorY = pdfSectionTitle(doc, cursorY, 'Custos do mês');
    if(typeof doc.autoTable === 'function'){
      doc.autoTable({
        startY: cursorY,
        margin: {left:14, right:14},
        head: [['Categoria','Descrição','Valor']],
        body: custoRows,
        styles:{fontSize:8.5, cellPadding:2.5},
        headStyles:{fillColor:[35,39,41], fontSize:8},
        alternateRowStyles:{fillColor:[248,245,238]}
      });
      cursorY = doc.lastAutoTable.finalY + 12;
    }
  }

  // pagina 2: graficos
  doc.addPage();
  cursorY = pdfHeader(doc, `Gráficos · ${monthLabel.charAt(0).toUpperCase()+monthLabel.slice(1)}`);

  const revByPlatform = ['airbnb','booking','outro'].map(p=>({
    label: platformLabel(p),
    value: monthBookings.filter(b=>b.platform===p).reduce((s,b)=>s+monthRevenueShare(b,y,m),0),
    color: PLATFORM_COLORS_RGB[p]
  }));
  cursorY = drawPieSection(doc, cursorY, 'Receita líquida por plataforma', revByPlatform);

  const custosPorCategoria = Object.keys(CATEGORY_LABELS).map(cat=>({
    label: CATEGORY_LABELS[cat],
    value: costs.filter(c=>c.month===monthKey(calMonth) && c.categoria===cat).reduce((s,c)=>s+Number(c.valor),0),
    color: CATEGORY_COLORS_RGB[cat]
  }));
  cursorY = drawPieSection(doc, cursorY, 'Custos por categoria', custosPorCategoria);

  doc.setFontSize(7.5);
  doc.setTextColor(150,150,150);
  doc.text(`Gerado em ${new Date().toLocaleDateString('pt-BR')}`, 14, 289);

  doc.save(`relatorio-intermares-${String(m+1).padStart(2,'0')}-${y}.pdf`);
}

function generateYearPDF(){
  if(!window.jspdf){
    toast('Sem conexão para gerar o PDF agora');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const year = calMonth.getFullYear();
  const monthNames = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  const monthData = [];
  for(let m=0; m<12; m++){
    const daysInMonth = new Date(year, m+1, 0).getDate();
    const receita = monthRevenue(year, m);
    const custo = monthCosts(year, m);
    const lucro = receita - custo;
    const occByDate = {};
    bookings.forEach(b=>{
      dateRange(b.checkin,b.checkout).forEach(d=>{
        const dt = new Date(d+'T00:00:00');
        if(dt.getFullYear()===year && dt.getMonth()===m) occByDate[d]=true;
      });
    });
    const nights = Object.keys(occByDate).length;
    const ocupacao = daysInMonth ? Math.round((nights/daysInMonth)*100) : 0;
    let reservas = 0;
    bookings.forEach(b=>{
      if(nightsInMonth(b, year, m) > 0) reservas++;
    });
    monthData.push({m, receita, custo, lucro, ocupacao, reservas});
  }

  const totalReceita = monthData.reduce((s,d)=>s+d.receita,0);
  const totalCusto = monthData.reduce((s,d)=>s+d.custo,0);
  const totalLucro = totalReceita - totalCusto;
  const mediaOcupacao = Math.round(monthData.reduce((s,d)=>s+d.ocupacao,0)/12);
  const margemMedia = totalReceita ? Math.round((totalLucro/totalReceita)*100) : 0;

  let cursorY = pdfHeader(doc, `Relatório anual · ${year}`);

  cursorY = drawKPICards(doc, cursorY, [
    {label:'Receita líquida', value:'R$ '+totalReceita.toLocaleString('pt-BR',{maximumFractionDigits:0})},
    {label:'Custos totais', value:'R$ '+totalCusto.toLocaleString('pt-BR',{maximumFractionDigits:0})},
    {label:'Lucro líquido', value:'R$ '+totalLucro.toLocaleString('pt-BR',{maximumFractionDigits:0}), color:[14,110,80]},
    {label:'Ocupação média', value: mediaOcupacao+'%'}
  ]);

  doc.setFontSize(8.5);
  doc.setTextColor(120,110,90);
  doc.text(`Margem de lucro média do ano: ${margemMedia}%`, 14, cursorY);
  doc.setTextColor(0,0,0);
  cursorY += 8;

  cursorY = pdfSectionTitle(doc, cursorY, 'Receita x custo por mês');

  const chartX = 14, chartH = 46, chartW = 182;
  const chartY = cursorY;
  const maxVal = Math.max(1, ...monthData.map(d=>Math.max(d.receita, d.custo)));
  const barGroupW = chartW/12;
  doc.setDrawColor(221,210,184);
  doc.line(chartX, chartY+chartH, chartX+chartW, chartY+chartH);
  monthData.forEach((d, i)=>{
    const barW = barGroupW*0.32;
    const xBase = chartX + i*barGroupW + barGroupW*0.12;
    const hReceita = maxVal ? (d.receita/maxVal)*chartH : 0;
    const hCusto = maxVal ? (d.custo/maxVal)*chartH : 0;
    doc.setFillColor(11,59,76);
    doc.rect(xBase, chartY+chartH-hReceita, barW, hReceita, 'F');
    doc.setFillColor(255,90,95);
    doc.rect(xBase+barW+1.5, chartY+chartH-hCusto, barW, hCusto, 'F');
    doc.setFontSize(6.5);
    doc.setTextColor(120,110,90);
    doc.text(monthNames[i], xBase, chartY+chartH+6);
  });
  doc.setTextColor(0,0,0);
  cursorY = chartY + chartH + 12;
  doc.setFontSize(8);
  doc.setFillColor(11,59,76);
  doc.rect(14, cursorY-4, 5, 5, 'F');
  doc.text('Receita', 21, cursorY);
  doc.setFillColor(255,90,95);
  doc.rect(55, cursorY-4, 5, 5, 'F');
  doc.text('Custo', 62, cursorY);
  cursorY += 10;

  const tableRows = monthData.map((d,i)=>[
    monthNames[i],
    d.reservas,
    'R$ '+d.receita.toLocaleString('pt-BR',{maximumFractionDigits:0}),
    'R$ '+d.custo.toLocaleString('pt-BR',{maximumFractionDigits:0}),
    'R$ '+d.lucro.toLocaleString('pt-BR',{maximumFractionDigits:0}),
    d.ocupacao+'%'
  ]);
  tableRows.push(['TOTAL', monthData.reduce((s,d)=>s+d.reservas,0), 'R$ '+totalReceita.toLocaleString('pt-BR',{maximumFractionDigits:0}), 'R$ '+totalCusto.toLocaleString('pt-BR',{maximumFractionDigits:0}), 'R$ '+totalLucro.toLocaleString('pt-BR',{maximumFractionDigits:0}), mediaOcupacao+'%']);

  if(typeof doc.autoTable === 'function'){
    doc.autoTable({
      startY: cursorY,
      margin: {left:14, right:14},
      head: [['Mês','Reservas','Receita','Custo','Lucro','Ocupação']],
      body: tableRows,
      styles:{fontSize:8, cellPadding:2},
      headStyles:{fillColor:[11,59,76], fontSize:7.5},
      alternateRowStyles:{fillColor:[248,245,238]},
      didParseCell: (data)=>{
        if(data.row.index === tableRows.length-1 && data.section==='body'){
          data.cell.styles.fontStyle = 'bold';
          data.cell.styles.fillColor = [235,224,204];
        }
      }
    });
  }

  doc.setFontSize(7.5);
  doc.setTextColor(150,150,150);
  doc.text(`Gerado em ${new Date().toLocaleDateString('pt-BR')}`, 14, 289);

  // pagina 2: analise e graficos anuais
  doc.addPage();
  cursorY = pdfHeader(doc, `Análise anual · ${year}`);

  const mesesComReceita = monthData.filter(d=>d.receita>0 || d.custo>0);
  let melhor = null, pior = null;
  if(mesesComReceita.length){
    melhor = mesesComReceita.reduce((a,b)=> b.lucro>a.lucro ? b : a);
    pior = mesesComReceita.reduce((a,b)=> b.lucro<a.lucro ? b : a);
  }

  cursorY = pdfSectionTitle(doc, cursorY, 'Destaques do ano');
  if(melhor || pior){
    const boxW = 89, boxH = 20, gap = 4;
    if(melhor){
      doc.setFillColor(230,242,236);
      doc.roundedRect(14, cursorY, boxW, boxH, 1.5, 1.5, 'F');
      doc.setFontSize(7.5); doc.setTextColor(120,110,90); doc.setFont('helvetica','bold');
      doc.text('MELHOR MÊS', 18, cursorY+7);
      doc.setFontSize(11.5); doc.setTextColor(14,110,80);
      doc.text(`${monthNames[melhor.m]} · R$ ${melhor.lucro.toLocaleString('pt-BR',{maximumFractionDigits:0})}`, 18, cursorY+15);
    }
    if(pior){
      doc.setFillColor(250,232,230);
      doc.roundedRect(14+boxW+gap, cursorY, boxW, boxH, 1.5, 1.5, 'F');
      doc.setFontSize(7.5); doc.setTextColor(120,110,90); doc.setFont('helvetica','bold');
      doc.text('MÊS MAIS FRACO', 18+boxW+gap, cursorY+7);
      doc.setFontSize(11.5); doc.setTextColor(200,60,50);
      doc.text(`${monthNames[pior.m]} · R$ ${pior.lucro.toLocaleString('pt-BR',{maximumFractionDigits:0})}`, 18+boxW+gap, cursorY+15);
    }
    doc.setTextColor(0,0,0);
    doc.setFont('helvetica','normal');
    cursorY += boxH + 10;
  } else {
    doc.setFontSize(9);
    doc.setTextColor(120,110,90);
    doc.text('Sem dados suficientes no ano.', 14, cursorY);
    doc.setTextColor(0,0,0);
    cursorY += 12;
  }

  const revByPlatformYear = ['airbnb','booking','outro'].map(p=>{
    let total = 0;
    for(let mm=0; mm<12; mm++){
      bookings.filter(b=>b.platform===p).forEach(b=>{
        total += monthRevenueShare(b, year, mm);
      });
    }
    return { label: platformLabel(p), value: total, color: PLATFORM_COLORS_RGB[p] };
  });
  cursorY = drawPieSection(doc, cursorY, 'Receita líquida por plataforma (ano)', revByPlatformYear);

  const custosPorCategoriaYear = Object.keys(CATEGORY_LABELS).map(cat=>({
    label: CATEGORY_LABELS[cat],
    value: costs.filter(c=>c.month.startsWith(String(year)) && c.categoria===cat).reduce((s,c)=>s+Number(c.valor),0),
    color: CATEGORY_COLORS_RGB[cat]
  }));
  cursorY = drawPieSection(doc, cursorY, 'Custos por categoria (ano)', custosPorCategoriaYear);

  doc.setFontSize(7.5);
  doc.setTextColor(150,150,150);
  doc.text(`Gerado em ${new Date().toLocaleDateString('pt-BR')}`, 14, 289);

  doc.save(`relatorio-anual-intermares-${year}.pdf`);
}

// events
$('pdfBtn').addEventListener('click', generateMonthPDF);
$('addBtn').addEventListener('click', ()=> openSheet(null));
$('cancelBtn').addEventListener('click', closeSheet);
$('sheetBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='sheetBackdrop') closeSheet(); });
document.querySelectorAll('#platformPick button').forEach(btn=>{
  btn.addEventListener('click', ()=> setPlatformUI(btn.dataset.p));
});
$('prevMonth').addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()-1); render(); });
$('nextMonth').addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()+1); render(); });

$('saveBtn').addEventListener('click', async ()=>{
  const guest = $('fGuest').value.trim();
  const checkin = $('fCheckin').value;
  const checkout = $('fCheckout').value;
  const valor = $('fValor').value;
  const obs = $('fObs').value.trim();

  if(!checkin || !checkout){ toast('Preencha check-in e check-out'); return; }
  if(checkout <= checkin){ toast('Check-out deve ser depois do check-in'); return; }

  const booking = {
    id: editingId || ('b_' + Date.now()),
    platform: selectedPlatform,
    guest, checkin, checkout,
    valor: valor ? Number(valor) : null,
    obs
  };

  const conflicts = findConflicts(booking);
  if(conflicts.length){
    $('warnBanner').textContent = '⚠ Conflito de datas com: ' + conflicts.map(c=>platformLabel(c.platform)+' - '+(c.guest||'')).join(', ');
    $('warnBanner').classList.add('show');
  }

  if(editingId){
    bookings = bookings.map(b => b.id === editingId ? booking : b);
  } else {
    bookings.push(booking);
  }
  await saveBookings();
  closeSheet();
  render();
  toast(conflicts.length ? 'Salvo com conflito de datas!' : 'Reserva salva');
});

$('bookingList').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const id = btn.dataset.id;
  const booking = bookings.find(b=>b.id===id);
  if(!booking) return;
  const act = btn.dataset.act;
  if(act === 'edit'){
    openSheet(booking);
  } else if(act === 'del'){
    if(confirm(`Excluir reserva de ${booking.guest||'hóspede'}?`)){
      bookings = bookings.filter(b=>b.id!==id);
      await saveBookings();
      render();
      toast('Reserva excluída');
    }
  } else if(act === 'cal'){
    generateICS(booking);
    toast('Baixado! Abra o arquivo pra adicionar ao Calendário');
  }
});

// custos do mês
$('addCostBtn').addEventListener('click', ()=> openCostSheet(null));
$('costCancelBtn').addEventListener('click', closeCostSheet);
$('costSheetBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='costSheetBackdrop') closeCostSheet(); });
$('copyPrevBtn').addEventListener('click', copyPrevMonthCosts);

$('costSaveBtn').addEventListener('click', async ()=>{
  const categoria = $('cCategoria').value;
  const descricao = $('cDescricao').value.trim();
  const valor = $('cValor').value;
  if(!valor || Number(valor) <= 0){ toast('Informe o valor do custo'); return; }

  const cost = {
    id: editingCostId || ('c_' + Date.now()),
    month: monthKey(calMonth),
    categoria,
    descricao,
    valor: Number(valor)
  };

  if(editingCostId){
    costs = costs.map(c => c.id === editingCostId ? cost : c);
  } else {
    costs.push(cost);
  }
  await saveCosts();
  closeCostSheet();
  render();
  toast('Custo salvo');
});

$('costsList').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const id = btn.dataset.id;
  const cost = costs.find(c=>c.id===id);
  if(!cost) return;
  const act = btn.dataset.act;
  if(act === 'editCost'){
    openCostSheet(cost);
  } else if(act === 'delCost'){
    if(confirm(`Excluir custo "${cost.descricao||CATEGORY_LABELS[cost.categoria]}"?`)){
      costs = costs.filter(c=>c.id!==id);
      await saveCosts();
      render();
      toast('Custo excluído');
    }
  }
});

$('pdfYearBtn').addEventListener('click', generateYearPDF);

loadCosts().then(()=> loadBookings());
</script>
